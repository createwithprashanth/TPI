networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: tpi-backend
    restart: unless-stopped
    networks:
      - internal
      - frontend
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - batch_outputs:/app/batch_outputs
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: tpi-backend
    restart: unless-stopped
    command: python worker.py
    networks:
      - internal
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - batch_outputs:/app/batch_outputs
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: tpi-frontend
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
  batch_outputs:
