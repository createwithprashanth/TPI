version: "3.9"

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ./models:/root/.ollama        # model files live in repo's models/ folder
    ports:
      - "11434:11434"                 # internal only — not exposed outside the server
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]    # GPU passthrough if available; ignored on CPU-only

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google_credentials.json
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    volumes:
      - batch_outputs:/app/batch_outputs
      - ./google_credentials.json:/app/google_credentials.json:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: python worker.py
    environment:
      - REDIS_URL=redis://redis:6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google_credentials.json
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    volumes:
      - batch_outputs:/app/batch_outputs
      - ./google_credentials.json:/app/google_credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis_data:
  batch_outputs:
