version: "3.9"

# Two isolated networks:
#   internal — backend, worker, redis, ollama (never reachable from host)
#   frontend  — frontend + backend (nginx proxies to backend over this net)
# Nothing on the internal network is reachable from the host or the internet.

networks:
  internal:
    driver: bridge
    internal: true          # no outbound internet from this network
  frontend:
    driver: bridge

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    image: tpi-backend
    build: ./backend
    restart: unless-stopped
    networks:
      - internal
      - frontend
    environment:
      - REDIS_URL=redis://redis:6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google_credentials.json
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    volumes:
      - batch_outputs:/app/batch_outputs
      - ./google_credentials.json:/app/google_credentials.json:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: python worker.py
    networks:
      - internal
    environment:
      - REDIS_URL=redis://redis:6379
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google_credentials.json
      - OLLAMA_HOST=http://ollama:11434
    env_file:
      - .env
    volumes:
      - batch_outputs:/app/batch_outputs
      - ./google_credentials.json:/app/google_credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    image: tpi-frontend
    build: ./frontend
    restart: unless-stopped
    networks:
      - frontend
    ports:
      - "80:80"             # only public port in the entire stack
    depends_on:
      - backend

volumes:
  redis_data:
  batch_outputs:
