# XYRA Studio — production nginx config
# Replaces /etc/nginx/nginx.conf (full http-context config so we can use
# limit_req_zone, server_tokens off, and all http-level directives).

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Suppress version disclosure ──────────────────────────────────────────
    server_tokens off;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml
        application/rss+xml font/truetype font/opentype
        application/vnd.ms-fontobject image/svg+xml;

    # ── Rate-limit zones ─────────────────────────────────────────────────────
    # api_general: 60 req/min per IP (burst of 20 queued)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    # api_upload:  10 req/min per IP  (P&ID process endpoint — heavy jobs)
    limit_req_zone $binary_remote_addr zone=api_upload:10m  rate=10r/m;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options          "DENY"                                        always;
        add_header X-Content-Type-Options   "nosniff"                                     always;
        add_header X-XSS-Protection         "1; mode=block"                               always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"             always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()"    always;

        # Content-Security-Policy (single directive — nginx does not concat quoted strings)
        # unsafe-inline/eval: required by React + Tailwind; blob worker-src: pdf.js
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src blob: 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Block direct access to sensitive paths ────────────────────────────
        # Deny dot-files (.env, .git, etc.) if ever served from document root
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Static assets (versioned by Vite hash) ───────────────────────────
        # Must be a top-level location — nested add_header blocks do NOT inherit
        # parent security headers in nginx, so all 6 headers re-declared here.
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control            "public, immutable";
            add_header X-Frame-Options          "DENY"                                        always;
            add_header X-Content-Type-Options   "nosniff"                                     always;
            add_header X-XSS-Protection         "1; mode=block"                               always;
            add_header Referrer-Policy          "strict-origin-when-cross-origin"             always;
            add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()"    always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src blob: 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
            access_log off;
        }

        # ── SPA routing ───────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API proxy ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    300s;
            proxy_connect_timeout  10s;
            proxy_send_timeout    300s;
            client_max_body_size  250M;

            # Strip backend server identity from responses
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
        }

        # Tighter rate limit on the heavy P&ID processing endpoint.
        location = /api/v1/pid/process {
            limit_req zone=api_upload burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout    600s;
            proxy_connect_timeout  10s;
            proxy_send_timeout    600s;
            client_max_body_size  250M;

            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
        }

        # Health endpoint — no rate limit, no auth required
        location = /api/v1/system/health {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_read_timeout 10s;
        }

        # Worker-start is blocked at the network edge for all client installs.
        # The backend also gates this via ALLOW_SYSTEM_WORKER_START (defence-in-depth).
        # To enable on a dev workstation, comment out the deny and uncomment the
        # loopback allow below, then rebuild the frontend container.
        location = /api/v1/system/worker/start {
            deny all;
            # allow 127.0.0.1;
            # proxy_pass http://backend;
        }

        # Explicit 404 for anything not matched
        error_page 404 /index.html;
    }
}
